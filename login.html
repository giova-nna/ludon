    <div class="login-container">
        <div class="container">
            <div class="login-tema">
                <i class="tema" data-lucide="moon"></i>
            </div>
            <div class="area-login">
                <div class="form-login">
                    <div class="logotipo">
                        <img class="logo" src="/assets/logos/logo.svg">
                        <h2 class="">Bem-vindo(a) de volta ao jogo</h2>
                    </div>
                    <form action="*">
                        <div class="formulario">
                            <label class="form-label" for="email">Nome de usuário ou e-mail</label>
                            <div class="input-container">
                                <i data-lucide="at-sign"></i>
                                <input type="input-login" type="text" name="usuario" id="usuario"
                                    placeholder="Digite o seu nome de usuário ou e-mail">
                            </div>

                            <label class="form-label" for="senha">Senha</label>
                            <div class="input-container">
                                <i data-lucide="lock"></i>
                                <input type="password" name="senha" id="senha" placeholder="Digite a sua senha">
                            </div>
                            <div class="botoes-input">
                                <a class="esqueci" href="cadastro.html">Esqueci minha
                                    senha</a><br>
                                <button class="botao-entrar" type="submit">
                                    ENTRAR
                                </button>
                            </div>

                            <div class="outro-login">
                                <div class="ou">
                                    <hr class="linha">
                                    <span>OU</span>
                                    <hr class="linha">
                                </div>

                                <button class="botao-entrar botao-alternativo">
                                    Entrar com Google
                                </button>
                                <div class="cadastrar">
                                    <span class="cadastre-se">Não tem uma conta ainda?<a href="cadastro.html">
                                            Cadastre-se agora!</a></span>
                                </div>

                            </div>



                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
