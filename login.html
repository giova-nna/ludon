<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludon - Login</title>
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/footer.css">
    <!-- fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="container">
            <div class="login-tema">
                <div class="tema-container">
                    <button type="button" class="botao-tema" id="botao-tema">
                        <i class="tema" data-lucide="moon"></i>
                    </button>
                    <div class="tema-menu" id="tema-menu">

                        <form id="form-tema">
                            <label for="tema">Cor do tema</label>

                            <select id="tema">
                                <option value="azul">Azul</option>
                                <option value="roxo">Roxo</option>
                                <option value="ciano">Ciano</option>
                                <option value="verde">Verde</option>
                                <option value="rosa">Rosa</option>
                                <option value="vermelho">Vermelho</option>
                                <option value="amarelo">Amarelo</option>
                                <option value="laranja">Laranja</option>
                            </select>

                            <button type="submit">Aplicar</button>
                        </form>

                    </div>
                </div>
            </div>
            <div class="area-login">
                <div class="form-login">
                    <div class="logotipo">
                        <img id="logo-ludon" class="logo" src="/assets/logos/logo.svg">
                        <h2 class="">Bem-vindo(a) de volta ao jogo</h2>
                    </div>
                    <form id="formulario-login">
                        <div class="formulario">
                            <label class="form-label" for="email"><span class="traco">l</span>Nome de usuário ou
                                e-mail</label>
                            <div class="input-container">
                                <i data-lucide="at-sign"></i>
                                <input class="input-login" type="text" name="usuario" id="usuario"
                                    placeholder="Digite o seu nome de usuário ou e-mail">
                            </div>

                            <label class="form-label" for="senha"><span class="traco">l</span>Senha</label>
                            <div class="input-container">
                                <i data-lucide="lock"></i>
                                <input type="password" name="senha" id="senha" placeholder="Digite a sua senha"
                                    required>
                            </div>
                            <div class="botoes-input">
                                <a class="esqueci" href="cadastro.html">Esqueci minha
                                    senha</a><br>
                                <button class="botao-entrar" type="submit">
                                    ENTRAR
                                </button>
                            </div>

                            <div class="outro-login">
                                <div class="ou">
                                    <hr class="linha">
                                    <span>OU</span>
                                    <hr class="linha">
                                </div>

                                <button type="button" class="botao-entrar botao-alternativo">
                                    Entrar com Google
                                </button>
                                <div class="cadastrar">
                                    <span class="cadastre-se">Não tem uma conta ainda?<a href="cadastro.html">
                                            Cadastre-se agora!</a></span>
                                </div>

                            </div>



                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- script pro lucide gerar os ícones -->
    <script>
        lucide.createIcons();
    </script>
    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
