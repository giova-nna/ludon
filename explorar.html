<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludon - explorar </title>
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/explorar.css">
    <link rel="stylesheet" href="css/footer.css">
    <!-- fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- nav -->
    <nav class="nav">
        <div class="container">
            <div class="nav-container">
                <div class="nav-esquerda">
                    <a class="logo" href="index.html">
                        <img id="logo-ludon" class="logo-svg" src="/assets/logos/logo.svg" alt="logo">
                    </a>
                </div>
                <div class="nav-centro">
                    <a href="explorar.html">Explorar</a>
                    <a href="https://github.com/giova-nna/ludon">Sobre</a>
                    <a href="perfil.html">Perfil</a>
                </div>
                <div class="nav-direita">
                    <div class="tema-container">
                        <button type="button" class="botao-tema" id="botao-tema">
                            <i class="tema" data-lucide="moon"></i>
                        </button>
                        <div class="tema-menu" id="tema-menu">

                            <form id="form-tema">
                                <label for="tema">Cor do tema</label>

                                <select id="tema">
                                    <option value="azul">Azul</option>
                                    <option value="roxo">Roxo</option>
                                    <option value="ciano">Ciano</option>
                                    <option value="verde">Verde</option>
                                    <option value="rosa">Rosa</option>
                                    <option value="vermelho">Vermelho</option>
                                    <option value="amarelo">Amarelo</option>
                                    <option value="laranja">Laranja</option>
                                </select>

                                <button type="submit">Aplicar</button>
                            </form>

                        </div>
                    </div>

                    <a class="botao-login" href="login.html">Entrar <i data-lucide="chevron-right"></i></a>
                </div>
            </div>
        </div>
    </nav>
    <!-- fim nav -->
    <!-- explorar -->
    <div class="explorar-container">
        <div class="container">
            <div class="titulo-pagina">
                <h1><i class="icone-titulo" data-lucide="globe"></i>Explorar</h1>
            </div>
            <div class="conteudo-explorar">
                <div class="jogos-recomendados">
                    <h2><span class="traco">l</span><i class="icone-titulo" data-lucide="crown"></i>Recomendados</h2>
                    <div class="jogos-grid" id="jogos-recomendados">

                    </div>
                </div>

                <div class="jogos-todos">
                    <h2><span class="traco">l</span><i class="icone-titulo" data-lucide="gamepad-2"></i>Todos os jogos
                    </h2>
                    <div class="jogos-grid" id="jogos-todos">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- fim explorar -->
    <!-- rodapé -->
    <footer class=" footer-container">
        <div class="container">
            <div class="footer-ludon">
                <div class="marca">
                    <div class="gamepad">
                        <i data-lucide="gamepad"></i>
                        <h2 style="font-family: Orbitron;">Lud<span>on</span></h2>
                    </div>

                    <div>um projeto de programação web</div>
                    <p class="copyright">© 2026 Ludon</p>
                </div>
                <div class="navegar">
                    <h3>Navegar</h3>
                    <a href="">Explorar</a>
                    <a href="login.html">Criar conta</a>
                </div>
                <div class="sobre">
                    <h3>Sobre</h3>
                    <a href="https://github.com/giova-nna/ludon">Termos de Seriço</a>
                    <a href="https://github.com/giova-nna/ludon">Política de Privacidade</a>
                    <a href="https://github.com/giova-nna/ludon">Contato</a>
                </div>
                <div class="social">
                    <h3>Social</h3>
                    <a href="https://github.com/giova-nna/ludon">Twitter</a>
                    <a href="https://github.com/giova-nna/ludon">Instagram</a>
                    <a href="https://github.com/giova-nna/ludon">Discord</a>
                </div>
            </div>
        </div>
    </footer>
    <!-- fim rodapé -->
    <script src="js/dados.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/explorar.js"></script>
    <!-- script pro lucide gerar os ícones -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
