<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludon - Cadastre-se</title>
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/footer.css">
    <!-- fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="cadastro-container">
        <div class="container">
            <div class="cadastro-tema">
                <i class="tema" data-lucide="moon"></i>
            </div>
            <div class="area-cadastro">
                <div class="form-cadastro">
                    <div class="logotipo">
                        <img class="logo" src="/assets/logos/logo.svg">
                        <h2 class="">Cadastre-se. Aqui você tem o controle.</h2>
                    </div>

                    <form id="formulario-cadastro" action="*">
                        <div class="formulario">

                            <div class="campo-grid">
                                <div class="campo">
                                    <label class="form-label" for="nome"><span class="traco">l</span>Nome</label>
                                    <div class="campo-nome input-container">

                                        <i data-lucide="user-round"></i>
                                        <input id="nome" type="text" name="nome" class="nome"
                                            placeholder="Digite seu nome" required>
                                    </div>
                                </div>

                                <div class="campo">
                                    <label class="form-label" for="nasc"><span class="traco">l</span>Data de
                                        nascimento</label>
                                    <div class="campo-nasc input-container">

                                        <i data-lucide="calendar"></i>
                                        <input id="nasc" type="date" name="nasc" class="nasc"
                                            placeholder="Data de nascimento" required>
                                    </div>
                                </div>

                            </div>
                            <label class="form-label" for="email"><span class="traco">l</span>E-mail</label>
                            <div class="campo-email input-container">

                                <i data-lucide="mail"></i>
                                <input id="email" type="email" name="email" class="email"
                                    placeholder="Digite seu e-mail" required>
                            </div>
                            <label class="form-label" for="usuario"><span class="traco">l</span>Nome de usuário</label>
                            <div class="campo-usuário input-container">

                                <i data-lucide="at-sign"></i>
                                <input id="usuario" type="text" name="usuario" class="usuario"
                                    placeholder="Digite seu nome" required>
                            </div>
                            <label class="form-label" for="senha"><span class="traco">l</span>Senha</label>
                            <div class="campo-senha input-container">

                                <i data-lucide="lock"></i>
                                <input id="senha" type="password" name="senha" class="senha"
                                    placeholder="Digite seu nome" required>
                            </div>
                            <button class="botao-cadastrar" type="submit">
                                CADASTRAR
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </div>


    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- script pro lucide gerar os ícones -->
    <script>
        lucide.createIcons();
    </script>
    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
